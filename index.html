<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle City P2P</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* FIX iOS : sans ça, impossible de taper dans le champ */
    input[type="text"] {
      user-select: text;
      -webkit-user-select: text;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }

    .network-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .id-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .id-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .id-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .id-value {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-green);
    }

    .join-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 16px; /* 16px = pas de zoom automatique sur iOS */
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-family: monospace;
      text-transform: uppercase;
    }

    input[type="text"]:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: #fff;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-copy {
      background: #334155;
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-copy.copied {
      background: var(--accent-green);
    }

    .btn-join {
      background: var(--accent-blue);
      white-space: nowrap;
    }

    .status-badge {
      font-size: 12px;
      text-align: center;
      color: #f59e0b;
      font-weight: 500;
      padding: 2px 0;
    }

    /* FIX : le wrapper prend la largeur dispo (sinon dépasse sur petits écrans) */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    .controls-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 6px 0;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 4px;
    }

    .btn-ctrl {
      width: 46px;
      height: 46px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .btn-ctrl:active {
      background: var(--border-color);
    }

    .btn-fire {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--accent-red);
      border: 2px solid #fca5a5;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .btn-fire:active {
      transform: scale(0.92);
      background: var(--accent-red);
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
    }

    /* Masqué uniquement si l'appareil a une vraie souris (pas sur tablette tactile) */
    @media (pointer: fine) {
      .controls-panel {
        display: none;
      }
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon.png">
</head>
<body>

  <div class="app-container">

    <!-- Panneau Réseau & Connexion -->
    <div class="network-card">
      <div class="id-row">
        <div class="id-info">
          <span class="id-label">Code de ma partie</span>
          <span id="my-id" class="id-value">...</span>
        </div>
        <button id="copy-btn" class="btn btn-copy" onclick="copyMyId()">
          <span id="copy-text">Copier</span>
        </button>
      </div>

      <div class="join-row">
        <input type="text" id="target-id" placeholder="Code de l'hôte..." maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn btn-join" onclick="connectToHost()">Rejoindre</button>
      </div>

      <div id="status" class="status-badge">Initialisation du réseau WebRTC...</div>
    </div>

    <!-- Zone de Jeu -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="480" height="480"></canvas>
    </div>

    <!-- Contrôles Tactiles -->
    <div class="controls-panel">
      <div class="dpad">
        <div></div>
        <button class="btn-ctrl" data-key="ArrowUp">▲</button>
        <div></div>
        <button class="btn-ctrl" data-key="ArrowLeft">◄</button>
        <div></div>
        <button class="btn-ctrl" data-key="ArrowRight">►</button>
        <div></div>
        <button class="btn-ctrl" data-key="ArrowDown">▼</button>
        <div></div>
      </div>

      <button class="btn-ctrl btn-fire" data-fire="1">💥</button>
    </div>

  </div>

<script>
  // ============================================================
  // CONSTANTES
  // ============================================================
  const W = 480, H = 480;
  const TANK = 24;
  const SPEED = 3;              // px par tick
  const BULLET_SPEED = 6;       // px par tick
  const SHOOT_CD = 350;         // ms entre deux tirs
  const TICK_MS = 1000 / 60;    // pas de temps fixe : 60 ticks/s
  const MAX_PLAYERS = 4;
  const PEER_PREFIX = 'bcp2p-';

  const SPAWNS = [
    { x: 48,  y: 228, dir: 'RIGHT' },
    { x: 408, y: 228, dir: 'LEFT'  },
    { x: 228, y: 48,  dir: 'DOWN'  },
    { x: 228, y: 408, dir: 'UP'    }
  ];
  const COLORS = ['#10b981', '#ef4444', '#3b82f6', '#f59e0b'];
  const DIRS = { UP: [0, -1], DOWN: [0, 1], LEFT: [-1, 0], RIGHT: [1, 0] };

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const myIdEl = document.getElementById("my-id");

  // ============================================================
  // ÉTAT
  // ============================================================
  let role = 'host';            // 'host' | 'client'
  let mySlot = 0;               // 0 = hôte, 1..3 = invités
  let tanks = [null, null, null, null];
  let bullets = [];             // { x, y, vx, vy, o }

  let peer = null;
  let roomCode = "";
  let conn = null;              // connexion vers l'hôte (si client)
  let players = [null, null, null, null]; // connexions invités (si hôte)
  let connectTimer = null;
  let pingTimer = null;
  let rtt = null;

  let tickCount = 0;
  let lastSentPos = "";

  // ============================================================
  // ENTRÉES (clavier + tactile)
  // ============================================================
  const keys = {};
  let fireHeld = false;

  function setKey(code, state) {
    keys[code] = state;
    if (state && navigator.vibrate) navigator.vibrate(10);
  }

  function getInput() {
    return {
      up:    !!(keys.ArrowUp    || keys.KeyW),
      down:  !!(keys.ArrowDown  || keys.KeyS),
      left:  !!(keys.ArrowLeft  || keys.KeyA),
      right: !!(keys.ArrowRight || keys.KeyD)
    };
  }

  function clearInputs() {
    for (const k in keys) keys[k] = false;
    fireHeld = false;
  }

  window.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space') { fireHeld = true; return; }
    keys[e.code] = true;
  });

  window.addEventListener("keyup", e => {
    if (e.code === 'Space') { fireHeld = false; return; }
    keys[e.code] = false;
  });

  // Évite les touches "coincées"
  window.addEventListener("blur", clearInputs);
  document.addEventListener("visibilitychange", () => {
    clearInputs();
    if (!document.hidden) requestWakeLock();
  });

  // Boutons tactiles (pointer events : multi-touch fiable + annulation gérée)
  document.querySelectorAll('[data-key]').forEach(btn => {
    const code = btn.dataset.key;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); setKey(code, true); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
      btn.addEventListener(ev, () => setKey(code, false)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  document.querySelectorAll('[data-fire]').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      fireHeld = true;
      if (navigator.vibrate) navigator.vibrate(10);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
      btn.addEventListener(ev, () => { fireHeld = false; }));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // Garde l'écran allumé (important pour l'hôte)
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* non bloquant */ }
  }
  window.addEventListener('pointerdown', requestWakeLock, { once: true });

  // ============================================================
  // UTILITAIRES UI
  // ============================================================
  function setStatus(text, color) {
    statusEl.textContent = text;
    statusEl.style.color = color || "#f59e0b";
  }

  function refreshStatus() {
    if (role === 'client') {
      const ping = rtt !== null ? rtt + ' ms' : '…';
      setStatus("⚡ P2P connecté · Joueur " + (mySlot + 1) + " · ping " + ping, "#3b82f6");
    } else {
      const n = players.filter(Boolean).length;
      if (n === 0) setStatus("Prêt. Partagez votre code (jusqu'à 4 joueurs).", "#f59e0b");
      else setStatus("🎮 " + (n + 1) + " joueurs connectés · Vous êtes l'Hôte", "#10b981");
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.userSelect = 'text';
    ta.style.webkitUserSelect = 'text';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { if (document.execCommand('copy')) done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copyMyId() {
    if (!roomCode) return;

    const done = () => {
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      copyBtn.classList.add('copied');
      copyText.textContent = 'Copié !';
      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyText.textContent = 'Copier';
      }, 2000);
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(roomCode).then(done).catch(() => fallbackCopy(roomCode, done));
    } else {
      fallbackCopy(roomCode, done);
    }
  }

  // ============================================================
  // TANKS / JEU
  // ============================================================
  function makeTank(slot) {
    const s = SPAWNS[slot];
    return { x: s.x, y: s.y, tx: s.x, ty: s.y, dir: s.dir, score: 0, q: 0, cd: 0 };
  }

  function resetSolo() {
    role = 'host';
    mySlot = 0;
    tanks = [makeTank(0), null, null, null];
    bullets = [];
    players = [null, null, null, null];
  }

  function moveTank(t, inp) {
    if (inp.up)         { t.y -= SPEED; t.dir = 'UP'; }
    else if (inp.down)  { t.y += SPEED; t.dir = 'DOWN'; }
    else if (inp.left)  { t.x -= SPEED; t.dir = 'LEFT'; }
    else if (inp.right) { t.x += SPEED; t.dir = 'RIGHT'; }

    t.x = Math.max(0, Math.min(W - TANK, t.x));
    t.y = Math.max(0, Math.min(H - TANK, t.y));
  }

  // Lissage des tanks distants (leur position arrive ~30 fois/s)
  function smoothRemote(t) {
    const dx = t.tx - t.x, dy = t.ty - t.y;
    if (Math.abs(dx) > 60 || Math.abs(dy) > 60) { t.x = t.tx; t.y = t.ty; }
    else { t.x += dx * 0.4; t.y += dy * 0.4; }
  }

  // Hôte uniquement : crée l'obus
  function tryShoot(slot) {
    const t = tanks[slot];
    if (!t || t.cd > 0) return;
    t.cd = SHOOT_CD;

    const v = DIRS[t.dir];
    bullets.push({
      x: t.x + TANK / 2 + v[0] * 14,
      y: t.y + TANK / 2 + v[1] * 14,
      vx: v[0] * BULLET_SPEED,
      vy: v[1] * BULLET_SPEED,
      o: slot
    });
  }

  function requestShoot() {
    const me = tanks[mySlot];
    if (!me || me.cd > 0) return;

    if (role === 'host') {
      tryShoot(0);
    } else if (conn && conn.open) {
      me.cd = SHOOT_CD;
      conn.send({ k: 'shoot' });
    }
  }

  // Hôte uniquement : déplacement des obus + collisions
  function hostBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;

      if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
        bullets.splice(i, 1);
        continue;
      }

      for (let s = 0; s < MAX_PLAYERS; s++) {
        const t = tanks[s];
        if (!t || s === b.o) continue;

        if (b.x >= t.x && b.x <= t.x + TANK && b.y >= t.y && b.y <= t.y + TANK) {
          if (tanks[b.o]) tanks[b.o].score++;
          // Réapparition de la victime
          const sp = SPAWNS[s];
          t.x = t.tx = sp.x;
          t.y = t.ty = sp.y;
          t.dir = sp.dir;
          t.q++;
          bullets.splice(i, 1);
          break;
        }
      }
    }
  }

  // Invité : avance les obus entre deux snapshots (affichage fluide)
  function clientBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) bullets.splice(i, 1);
    }
  }

  function tick() {
    tickCount++;

    // Mon tank : mouvement local immédiat (zéro latence ressentie)
    const me = tanks[mySlot];
    if (me) {
      moveTank(me, getInput());
      if (fireHeld) requestShoot();
    }

    // Cooldowns
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const t = tanks[i];
      if (t && t.cd > 0) t.cd -= TICK_MS;
    }

    // Lissage des tanks des autres joueurs
    for (let i = 0; i < MAX_PLAYERS; i++) {
      if (i !== mySlot && tanks[i]) smoothRemote(tanks[i]);
    }

    if (role === 'host') {
      hostBullets();
      if (tickCount % 3 === 0) broadcastSnapshot(); // 20 Hz
    } else {
      clientBullets();
      if (tickCount % 2 === 0) sendMyPosition();    // 30 Hz
    }
  }

  // ============================================================
  // RÉSEAU
  // ============================================================
  function genCode() {
    const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
    return s;
  }

  function initPeer() {
    if (typeof Peer === 'undefined') {
      myIdEl.textContent = "—";
      setStatus("Bibliothèque PeerJS non chargée (internet requis). Mode solo.", "#ef4444");
      return;
    }

    roomCode = genCode();
    peer = new Peer(PEER_PREFIX + roomCode, {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
          // Pour les réseaux 4G/entreprise stricts, ajouter un serveur TURN :
          // { urls: 'turn:VOTRE_SERVEUR:3478', username: '...', credential: '...' }
        ]
      }
    });

    peer.on('open', () => {
      myIdEl.textContent = roomCode;
      refreshStatus();
    });

    peer.on('connection', onIncomingConnection);

    peer.on('disconnected', () => {
      // Perte du serveur de signalisation : les parties en cours restent actives
      if (peer && !peer.destroyed) peer.reconnect();
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {   // code déjà pris : on en génère un autre
        peer.destroy();
        initPeer();
        return;
      }
      if (err.type === 'peer-unavailable') {
        clearTimeout(connectTimer);
        conn = null;
        setStatus("Aucune partie trouvée avec ce code.", "#ef4444");
        return;
      }
      if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        setStatus("Serveur de connexion injoignable…", "#ef4444");
        return;
      }
      setStatus("Erreur réseau : " + err.type, "#ef4444");
    });
  }

  // ---------- Côté HÔTE ----------
  function onIncomingConnection(c) {
    let slot = -1;

    c.on('open', () => {
      // Un invité ne peut pas servir d'hôte
      if (role === 'client') { c.send({ k: 'full' }); setTimeout(() => c.close(), 200); return; }

      for (let i = 1; i < MAX_PLAYERS; i++) {
        if (!players[i]) { slot = i; break; }
      }
      if (slot < 0) { c.send({ k: 'full' }); setTimeout(() => c.close(), 200); return; }

      players[slot] = c;
      tanks[slot] = makeTank(slot);
      c.send({ k: 'hello', slot: slot });
      refreshStatus();
    });

    c.on('data', d => {
      if (slot < 0) return;
      onHostData(slot, c, d);
    });

    const leave = () => {
      if (slot > 0 && players[slot] === c) {
        players[slot] = null;
        tanks[slot] = null;
        bullets = bullets.filter(b => b.o !== slot);
        refreshStatus();
      }
    };
    c.on('close', leave);
    c.on('error', leave);
  }

  function num(v, def) {
    return (typeof v === 'number' && isFinite(v)) ? v : def;
  }

  function onHostData(slot, c, d) {
    const t = tanks[slot];
    if (!t || !d) return;

    if (d.k === 'pos') {
      if (d.q !== t.q) return; // position périmée (avant réapparition) : ignorée
      t.tx = Math.max(0, Math.min(W - TANK, num(d.x, t.tx)));
      t.ty = Math.max(0, Math.min(H - TANK, num(d.y, t.ty)));
      if (DIRS[d.d]) t.dir = d.d;
    } else if (d.k === 'shoot') {
      // Utilise la position la plus récente connue de l'invité
      t.x = t.tx; t.y = t.ty;
      tryShoot(slot);
    } else if (d.k === 'ping') {
      c.send({ k: 'pong', t: d.t });
    }
  }

  function broadcastSnapshot() {
    let any = false;
    for (let i = 1; i < MAX_PLAYERS; i++) if (players[i] && players[i].open) any = true;
    if (!any) return;

    const snap = {
      k: 'snap',
      t: tanks.map(t => t ? { x: t.x, y: t.y, d: t.dir, s: t.score, q: t.q } : 0),
      b: bullets.map(b => [b.x, b.y, b.vx, b.vy, b.o])
    };

    for (let i = 1; i < MAX_PLAYERS; i++) {
      const c = players[i];
      if (c && c.open) c.send(snap);
    }
  }

  // ---------- Côté INVITÉ ----------
  function connectToHost() {
    if (!peer || !peer.open) return alert("Réseau pas encore prêt, patientez un instant.");
    if (role === 'client') return;
    if (players.some(Boolean)) return alert("Des joueurs sont déjà connectés à votre partie.");

    let code = document.getElementById('target-id').value.trim().toUpperCase();
    code = code.replace(/^BCP2P-/, '');
    if (!code) return alert("Veuillez entrer un code valide.");
    if (code === roomCode) return alert("C'est votre propre code !");

    setStatus("Connexion en cours à l'hôte...", "#f59e0b");

    const c = peer.connect(PEER_PREFIX + code, { serialization: 'json' });
    conn = c;

    clearTimeout(connectTimer);
    connectTimer = setTimeout(() => {
      if (!c.open) {
        conn = null;
        c.close();
        setStatus("Impossible de se connecter (réseau bloquant le P2P ? un serveur TURN peut être nécessaire).", "#ef4444");
      }
    }, 12000);

    c.on('open', () => {
      clearTimeout(connectTimer);
      role = 'client';
      mySlot = -1;
      tanks = [null, null, null, null];
      bullets = [];
      rtt = null;
      lastSentPos = "";

      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        if (c.open) c.send({ k: 'ping', t: performance.now() });
      }, 2000);

      setStatus("Connexion établie, synchronisation...", "#3b82f6");
    });

    c.on('data', onClientData);
    c.on('close', () => onHostLost(c));
    c.on('error', () => onHostLost(c));
  }

  function onHostLost(c) {
    if (conn !== c) return;
    clearInterval(pingTimer);
    clearTimeout(connectTimer);
    conn = null;
    const wasClient = (role === 'client');
    resetSolo();
    setStatus(wasClient ? "Connexion à l'hôte perdue. Retour en mode hôte." : "Connexion fermée.", "#ef4444");
  }

  function onClientData(d) {
    if (!d) return;

    if (d.k === 'hello') {
      mySlot = d.slot;
      tanks[mySlot] = makeTank(mySlot);
      refreshStatus();
    } else if (d.k === 'full') {
      setStatus("Partie complète (4 joueurs maximum).", "#ef4444");
    } else if (d.k === 'pong') {
      rtt = Math.round(performance.now() - d.t);
      refreshStatus();
    } else if (d.k === 'snap') {
      applySnapshot(d);
    }
  }

  function applySnapshot(snap) {
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const s = snap.t[i];
      if (!s) { if (i !== mySlot) tanks[i] = null; continue; }

      let t = tanks[i];
      if (!t) {
        t = tanks[i] = { x: s.x, y: s.y, tx: s.x, ty: s.y, dir: s.d, score: s.s, q: s.q, cd: 0 };
      }
      t.score = s.s;

      if (i === mySlot) {
        // Je suis maître de ma position, sauf si l'hôte m'a fait réapparaître
        if (s.q !== t.q) {
          t.q = s.q;
          t.x = s.x; t.y = s.y; t.tx = s.x; t.ty = s.y;
          t.dir = s.d;
        }
      } else {
        t.tx = s.x; t.ty = s.y; t.dir = s.d;
      }
    }

    bullets = snap.b.map(a => ({ x: a[0], y: a[1], vx: a[2], vy: a[3], o: a[4] }));
  }

  function sendMyPosition() {
    const me = tanks[mySlot];
    if (!me || !conn || !conn.open) return;

    const key = me.x + "," + me.y + "," + me.dir + "," + me.q;
    if (key === lastSentPos) return; // rien n'a changé : on n'envoie rien
    lastSentPos = key;

    conn.send({ k: 'pos', x: me.x, y: me.y, d: me.dir, q: me.q });
  }

  // ============================================================
  // BOUCLE & RENDU
  // ============================================================
  let lastTime = performance.now();
  let acc = 0;

  function frame(now) {
    acc += Math.min(now - lastTime, 250);
    lastTime = now;

    while (acc >= TICK_MS) {
      tick();
      acc -= TICK_MS;
    }

    render();
    requestAnimationFrame(frame);
  }

  function render() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, W, H);

    // Grille décorative
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let i = 0; i < W; i += 24) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    // Tanks
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const t = tanks[i];
      if (!t) continue;

      ctx.fillStyle = COLORS[i];
      ctx.fillRect(t.x, t.y, TANK, TANK);

      if (i === mySlot) {
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 1;
        ctx.strokeRect(t.x - 2, t.y - 2, TANK + 4, TANK + 4);
      }

      ctx.fillStyle = '#f8fafc';
      if (t.dir === 'UP')    ctx.fillRect(t.x + 10, t.y - 6, 4, 8);
      if (t.dir === 'DOWN')  ctx.fillRect(t.x + 10, t.y + 22, 4, 8);
      if (t.dir === 'LEFT')  ctx.fillRect(t.x - 6, t.y + 10, 8, 4);
      if (t.dir === 'RIGHT') ctx.fillRect(t.x + 22, t.y + 10, 8, 4);
    }

    // Obus
    ctx.fillStyle = '#f59e0b';
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    // Scores
    ctx.font = 'bold 12px monospace';
    ctx.textBaseline = 'top';
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const t = tanks[i];
      if (!t) continue;
      ctx.fillStyle = COLORS[i];
      ctx.fillText('J' + (i + 1) + ': ' + t.score, 8 + i * 70, 6);
    }
  }

  // ============================================================
  // LANCEMENT
  // ============================================================
  resetSolo();
  initPeer();
  requestAnimationFrame(frame);
</script>
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(err=>console.error(err));
});
}
</script>
